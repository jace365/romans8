<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>로마서8장</title>
<style>
:root{--bg:#faf8f4;--sf:#fff;--tx:#2a2622;--mu:#7a7268;--ac:#9a5b2e;--ok:#3f8a5a;--bd:#e4ddd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1a17;--sf:#27241f;--tx:#efe9df;--mu:#a39a8d;--ac:#d9955c;--ok:#6cc38a;--bd:#3a352e;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0}h2{font-size:16px;margin:20px 0 8px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
button{font:inherit;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.on{background:var(--ok);border-color:var(--ok);color:#fff}
input{font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:6px 10px;min-width:0;width:100%}
.mu{color:var(--mu);font-size:14px}.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto}.tabs button{flex:1 0 auto;white-space:nowrap}
.v{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}.v:first-child{border:0}.v b{color:var(--ac);min-width:24px}.v.m{opacity:.55}.v .t{flex:1;cursor:pointer}.h .t span{filter:blur(6px)}.h .t span.r{filter:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal div{padding:8px 0;border-radius:8px;font-size:14px}.cal .d{border:1px solid var(--bd);cursor:pointer}.cal .d.on{background:var(--ok);color:#fff;border-color:var(--ok)}.cal .d.f{opacity:.35;cursor:default}.cal .d.t{outline:2px solid var(--ac)}.cal .d.sl{box-shadow:0 0 0 2px var(--ok)}.v.sel{box-shadow:inset 3px 0 0 var(--ac)}.v.spk,.spkt{background:color-mix(in srgb,var(--ac) 22%,transparent);border-radius:8px}.w.hw{background:var(--ac);color:#fff;border-radius:4px;padding:0 2px}.h .t span.r span{filter:none}
.tb{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-top:1px solid var(--bd);text-align:left;white-space:nowrap}
</style><script src="config.js"></script></head><body><main id="app"><p class="mu">불러오는 중…</p></main>
<script>
const V=[{"n": 1, "t": "그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니"}, {"n": 2, "t": "이는 그리스도 예수 안에 있는 생명의 성령의 법이 죄와 사망의 법에서 너를 해방하였음이라"}, {"n": 3, "t": "율법이 육신으로 말미암아 연약하여 할 수 없는 그것을 하나님은 하시나니 곧 죄로 말미암아 자기 아들을 죄 있는 육신의 모양으로 보내어 육신에 죄를 정하사"}, {"n": 4, "t": "육신을 따르지 않고 그 영을 따라 행하는 우리에게 율법의 요구가 이루어지게 하려 하심이니라"}, {"n": 5, "t": "육신을 따르는 자는 육신의 일을, 영을 따르는 자는 영의 일을 생각하나니"}, {"n": 6, "t": "육신의 생각은 사망이요 영의 생각은 생명과 평안이니라"}, {"n": 7, "t": "육신의 생각은 하나님과 원수가 되나니 이는 하나님의 법에 굴복하지 아니할 뿐 아니라 할 수도 없음이라"}, {"n": 8, "t": "육신에 있는 자들은 하나님을 기쁘시게 할 수 없느니라"}, {"n": 9, "t": "만일 너희 속에 하나님의 영이 거하시면 너희가 육신에 있지 아니하고 영에 있나니 누구든지 그리스도의 영이 없으면 그리스도의 사람이 아니라"}, {"n": 10, "t": "또 그리스도께서 너희 안에 계시면 몸은 죄로 말미암아 죽은 것이나 영은 의로 말미암아 살아 있는 것이니라"}, {"n": 11, "t": "예수를 죽은 자 가운데서 살리신 이의 영이 너희 안에 거하시면 그리스도 예수를 죽은 자 가운데서 살리신 이가 너희 안에 거하시는 그의 영으로 말미암아 너희 죽을 몸도 살리시리라"}, {"n": 12, "t": "그러므로 형제들아 우리가 빚진 자로되 육신에게 져서 육신대로 살 것이 아니니라"}, {"n": 13, "t": "너희가 육신대로 살면 반드시 죽을 것이로되 영으로써 몸의 행실을 죽이면 살리니"}, {"n": 14, "t": "무릇 하나님의 영으로 인도함을 받는 사람은 곧 하나님의 아들이라"}, {"n": 15, "t": "너희는 다시 무서워하는 종의 영을 받지 아니하고 양자의 영을 받았으므로 우리가 아빠 아버지라고 부르짖느니라"}, {"n": 16, "t": "성령이 친히 우리의 영과 더불어 우리가 하나님의 자녀인 것을 증언하시나니"}, {"n": 17, "t": "자녀이면 또한 상속자 곧 하나님의 상속자요 그리스도와 함께 한 상속자니 우리가 그와 함께 영광을 받기 위하여 고난도 함께 받아야 할 것이니라"}, {"n": 18, "t": "생각하건대 현재의 고난은 장차 우리에게 나타날 영광과 비교할 수 없도다"}, {"n": 19, "t": "피조물이 고대하는 바는 하나님의 아들들이 나타나는 것이니"}, {"n": 20, "t": "피조물이 허무한 데 굴복하는 것은 자기 뜻이 아니요 오직 굴복하게 하시는 이로 말미암음이라"}, {"n": 21, "t": "그 바라는 것은 피조물도 썩어짐의 종 노릇 한 데서 해방되어 하나님의 자녀들의 영광의 자유에 이르는 것이니라"}, {"n": 22, "t": "피조물이 다 이제까지 함께 탄식하며 함께 고통을 겪고 있는 것을 우리가 아느니라"}, {"n": 23, "t": "그뿐 아니라 또한 우리 곧 성령의 처음 익은 열매를 받은 우리까지도 속으로 탄식하여 양자 될 것 곧 우리 몸의 속량을 기다리느니라"}, {"n": 24, "t": "우리가 소망으로 구원을 얻었으매 보이는 소망이 소망이 아니니 보는 것을 누가 바라리요"}, {"n": 25, "t": "만일 우리가 보지 못하는 것을 바라면 참음으로 기다릴지니라"}, {"n": 26, "t": "이와 같이 성령도 우리의 연약함을 도우시나니 우리는 마땅히 기도할 바를 알지 못하나 오직 성령이 말할 수 없는 탄식으로 우리를 위하여 친히 간구하시느니라"}, {"n": 27, "t": "마음을 살피시는 이가 성령의 생각을 아시나니 이는 성령이 하나님의 뜻대로 성도를 위하여 간구하심이니라"}, {"n": 28, "t": "우리가 알거니와 하나님을 사랑하는 자 곧 그의 뜻대로 부르심을 입은 자들에게는 모든 것이 합력하여 선을 이루느니라"}, {"n": 29, "t": "하나님이 미리 아신 자들을 또한 그 아들의 형상을 본받게 하기 위하여 미리 정하셨으니 이는 그로 많은 형제 중에서 맏아들이 되게 하려 하심이니라"}, {"n": 30, "t": "또 미리 정하신 그들을 또한 부르시고 부르신 그들을 또한 의롭다 하시고 의롭다 하신 그들을 또한 영화롭게 하셨느니라"}, {"n": 31, "t": "그런즉 이 일에 대하여 우리가 무슨 말 하리요 만일 하나님이 우리를 위하시면 누가 우리를 대적하리요"}, {"n": 32, "t": "자기 아들을 아끼지 아니하시고 우리 모든 사람을 위하여 내주신 이가 어찌 그 아들과 함께 모든 것을 우리에게 주시지 아니하겠느냐"}, {"n": 33, "t": "누가 능히 하나님께서 택하신 자들을 고발하리요 의롭다 하신 이는 하나님이시니"}, {"n": 34, "t": "누가 정죄하리요 죽으실 뿐 아니라 다시 살아나신 이는 그리스도 예수시니 그는 하나님 우편에 계신 자요 우리를 위하여 간구하시는 자시니라"}, {"n": 35, "t": "누가 우리를 그리스도의 사랑에서 끊으리요 환난이나 곤고나 박해나 기근이나 적신이나 위험이나 칼이랴"}, {"n": 36, "t": "기록된 바 우리가 종일 주를 위하여 죽임을 당하게 되며 도살 당할 양 같이 여김을 받았나이다 함과 같으니라"}, {"n": 37, "t": "그러나 이 모든 일에 우리를 사랑하시는 이로 말미암아 우리가 넉넉히 이기느니라"}, {"n": 38, "t": "내가 확신하노니 사망이나 생명이나 천사들이나 권세자들이나 현재 일이나 장래 일이나 능력이나"}, {"n": 39, "t": "높음이나 깊음이나 다른 어떤 피조물이라도 우리를 우리 주 그리스도 예수 안에 있는 하나님의 사랑에서 끊을 수 없으리라"}];
const SB_URL='',SB_KEY='';/* 단독 실행용: Supabase Project URL / anon key를 여기에 넣거나 화면에서 입력 */
function sbAdapter(url,key){const base=url.replace(/\/+$/,'')+'/rest/v1/kv',H={apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},e=encodeURIComponent;
 const q=(m,s,b,x)=>fetch(base+s,{method:m,headers:{...H,...x},body:b===undefined?undefined:JSON.stringify(b)}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return m==='GET'?r.json():null});
 const one=async p=>{const r=await q('GET','?select=data&path=eq.'+e(p));return r[0]?r[0].data:undefined},put=(p,d)=>q('POST','',{path:p,data:d},{Prefer:'resolution=merge-duplicates,return=minimal'});
 const poll=(fn,cb,err)=>{let stop=false,last;const run=async()=>{try{const x=await fn(),j=JSON.stringify(x===undefined?null:x);if(j!==last){last=j;cb(x)}}catch(e){err&&err(e)}if(!stop)setTimeout(run,3000)};run();return()=>{stop=true}};
 const doc=p=>({set:d=>put(p,d),update:async d=>put(p,{...((await one(p))||{}),...d}),delete:()=>q('DELETE','?path=eq.'+e(p)),onSnapshot:(cb,err)=>poll(()=>one(p),x=>cb({data:()=>x}),err)});
 return{doc,collection:p=>({doc:id=>doc(p+'/'+id),onSnapshot:(cb,err)=>poll(async()=>(await q('GET','?select=path,data&path=like.'+e(p+'/')+'*')).filter(r=>!r.path.slice(p.length+1).includes('/')),x=>cb({docs:x.map(r=>({id:r.path.slice(p.length+1),data:()=>r.data}))}),err)})}}
let db=null,S={me:null,admin:false,users:{},prog:{},cfg:{},tab:'today',hide:false,rev:{},mo:new Date(),err:'',ready:false};
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),TD=ymd(new Date());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const apw=()=>S.cfg.adminPw||'12345',P=id=>{const p=S.prog[id]||{},v={};for(const k in p.verses||{})if(p.verses[k])v[/^\d+$/.test(k)?'v'+k:k]=1;return{days:p.days||{},verses:v,marks:p.marks||{},log:p.log||{}}};
const nDays=id=>Object.keys(P(id).days||{}).length,nV=id=>Object.keys(P(id).verses||{}).length;
function streak(id){let d=new Date(),c=0,D=P(id).days||{};if(!D[ymd(d)])d.setDate(d.getDate()-1);while(D[ymd(d)]){c++;d.setDate(d.getDate()-1)}return c}
const bar=(a,b)=>`<div class="bar"><i style="width:${b?Math.round(a/b*100):0}%"></i></div>`;
async function save(id,fn){const p=JSON.parse(JSON.stringify(P(id)));p.days=p.days||{};p.verses=p.verses||{};p.marks=p.marks||{};p.log=p.log||{};fn(p);S.prog[id]=p;render();try{await db.doc('progress/'+id).set(p)}catch(e){S.err='저장 실패: 쓰기 권한(Contributor 이상)이 필요합니다.';render()}}
function login(name,pw){name=name.trim();if(name.toLowerCase()==='admin'){if(pw===apw()){S.admin=true;S.me=null;S.av=false;S.err=''}else S.err='관리자 비밀번호가 올바르지 않습니다.'}
 else{const e=Object.entries(S.users).find(([i,u])=>u.name===name);if(e&&e[1].pw===pw){S.me=e[0];S.admin=false;S.err='';S.tab='today';S.pin=null;try{localStorage.setItem('rome',JSON.stringify([name,pw]))}catch(_){}}else S.err='이름 또는 비밀번호가 올바르지 않습니다.'}
 render()}
function logout(){S.me=null;S.admin=false;S.av=false;S.pin=null;S.tab='today';S.showLogin=false;try{localStorage.removeItem('rome')}catch(_){}render()}
function head(t){return `<div class="row sp"><h1>📖 로마서8장</h1><div class="row"><span class="mu">${esc(t)}</span><button data-a="out">로그아웃</button></div></div>`}
function vTab(){const id=S.me,p=P(id);return `<div class="card"><div class="row sp"><b>${V.length}절 중 ${nV(id)}절 암송 완료</b><span class="mu">${Math.round(nV(id)/V.length*100)}%</span></div>${bar(nV(id),V.length)}
<div class="row" style="margin-top:10px"><button data-a="hide" class="${S.hide?'on':''}">${S.hide?'본문 보이기':'본문 가리기(암송 연습)'}</button><span class="mu">탭하면 본문 확인</span></div></div>
<div class="card ${S.hide?'h':''}">${V.map(v=>`<div class="v ${p.verses['v'+v.n]?'m':''}"><input type="checkbox" style="width:20px;margin-top:5px" data-a="vs" data-n="${v.n}" ${p.verses['v'+v.n]?'checked':''}><b>${v.n}</b><div class="t" data-a="rv" data-n="${v.n}"><span class="${S.rev[v.n]?'r':''}">${esc(v.t)}</span></div></div>`).join('')}</div>`}
function curV(){const id=S.me;if(S.pin&&S.pin.id===id)return V[S.pin.n-1];const vs=P(id).verses,ks=Object.keys(vs).map(k=>+k.slice(1)),mx=ks.length?Math.max(...ks):0;let n=mx+1;if(n>V.length)n=(V.find(v=>!vs['v'+v.n])||V[0]).n;if(S.pready)S.pin={id,n};return V[n-1]}
const spkOK=!!window.speechSynthesis;
function clrTm(){(S.tm||[]).forEach(clearTimeout);S.tm=[]}
function wrapW(el,txt){let h='',i=0;txt.replace(/\S+/g,(w,o)=>{h+=esc(txt.slice(i,o))+'<span class="w" data-o="'+o+'">'+esc(w)+'</span>';i=o+w.length;return w});el.innerHTML=h+esc(txt.slice(i));return[...el.querySelectorAll('.w')]}
function spkStop(){clrTm();S.tok=(S.tok||0)+1;S.spk=0;if(spkOK)speechSynthesis.cancel()}
function spk(list,reps=1,fw){if(!spkOK)return;spkStop();const t=S.tok,q=[];list.forEach(v=>{for(let r=1;r<=reps;r++)q.push([v,r])});let i=0;const go=()=>{if(t!==S.tok)return;if(i>=q.length){S.spk=0;render();return}const [v,r]=q[i++],u=new SpeechSynthesisUtterance((r===1?v.n+'절. ':'')+(fw?v.t.split(/\s+/)[0]:v.t));S.cnt=r;S.tot=reps;u.lang='ko-KR';u.rate=.9;const ko=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.startsWith('ko'));if(ko)u.voice=ko;S.spk=v.n;u.onend=()=>{if(t===S.tok)go()};u.onerror=()=>{if(t===S.tok){S.spk=0;render()}};clrTm();if(S.tab==='read')S.rn=v.n;render();const hl=document.querySelector('.v.spk');if(hl)hl.scrollIntoView({block:'center',behavior:'smooth'});
 const tg=document.querySelector('.v.spk .t')||document.querySelector('.spkt span');
 if(tg){const pre=r===1?(v.n+'절. ').length:0,ws=wrapW(tg,fw?v.t.split(/\s+/)[0]:v.t),mark=k=>ws.forEach((x,j)=>x.classList.toggle('hw',j===k));let got=false;
  u.onboundary=e=>{if(t!==S.tok||(e.name&&e.name!=='word'))return;const o=e.charIndex-pre;if(o<0)return;got=true;clrTm();let k=0;ws.forEach((x,j)=>{if(+x.dataset.o<=o)k=j});mark(k)};
  let acc=pre*200;ws.forEach((x,j)=>{S.tm.push(setTimeout(()=>{if(!got&&t===S.tok)mark(j)},acc));acc+=(x.textContent.length+1)*200})}
 speechSynthesis.speak(u)};go()}
const rc=n=>(S.spk===n?' spk':'')+((S.pk||{})[n]?' sel':'');
const pkList=()=>{const pk=S.pk||{},p=P(S.me);return V.filter(v=>pk[v.n]&&(S.tab!=='mark'||p.marks['v'+v.n]))};
const pkBar=()=>{if(!spkOK)return'';const n=pkList().length;return `<div class="row" style="margin:6px 0"><button data-a="pkall">전체 선택</button><button data-a="pkclr">선택 해제</button><button data-a="spsel" class="${S.spk?'on':'p'}">${S.spk?'⏹ 중지':`▶ 선택 듣기 (${n}절 × ${gr()}회)`}</button></div>`};
const gr=()=>{if(!S.rep){try{S.rep=+localStorage.getItem('rome-rep')||1}catch(_){S.rep=1}}return S.rep};
